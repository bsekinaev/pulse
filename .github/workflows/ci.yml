name: Проверка ПУЛЬС

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: python -m pip install -e '.[dev]'
      - name: Запустить тесты
        run: python -m pytest -q
