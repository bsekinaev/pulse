name: Проверка ПУЛЬС

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: python -m pip install -e '.[dev]'
      - name: Запустить тесты
        run: python -m pytest -q

  docker:
    name: Docker / health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ
        run: docker build -t pulse:ci .
      - name: Проверить запуск контейнера
        run: |
          docker run -d --name pulse-ci -p 127.0.0.1:18120:8000 \
            -e APP_ENV=production \
            -e APP_SECRET_KEY=ci-secret-key-0123456789-abcdef-0123456789 \
            -e ADMIN_PASSWORD=ci-example-password-12345 \
            -e DATABASE_URL=sqlite:////tmp/pulse-ci.db \
            pulse:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18120/health; then exit 0; fi
            sleep 2
          done
          docker logs pulse-ci
          exit 1
