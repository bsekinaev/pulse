{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="auth">
  <span class="eyebrow">Панель ответственного</span>
  <h1>Контроль адаптации</h1>
  <p class="muted">Войдите для просмотра сотрудников и решения проблем.</p>
  <form class="panel form" method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <label>Логин<input name="username" autocomplete="username" required></label>
    <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Войти в панель</button>
  </form>
</section>
{% endblock %}
